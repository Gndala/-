<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>سجل القيود المدرسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1D2A3A;
    --ink-soft:#3B4A5E;
    --parchment:#F4EEDC;
    --parchment-2:#ECE3C8;
    --line:#D8CCA6;
    --gold:#A9803D;
    --gold-deep:#8A6A2F;
    --maroon:#7C3B34;
    --red:#A83A32;
    --sage:#5C6B4F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    background-image:
      radial-gradient(circle at 0% 0%, rgba(169,128,61,0.06), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(92,107,79,0.06), transparent 40%);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
    padding-bottom:96px;
  }
  .header{
    padding:28px 20px 20px;
    text-align:center;
    border-bottom:2px solid var(--line);
    position:relative;
  }
  .header::after{
    content:"";
    position:absolute;
    bottom:-6px;left:50%;
    transform:translateX(-50%);
    width:90px;height:2px;
    background:var(--gold);
  }
  .header h1{
    font-family:'Markazi Text', serif;
    font-size:34px;
    font-weight:700;
    margin:0 0 6px;
    color:var(--ink);
    letter-spacing:.5px;
  }
  .header .sub{
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .header .sub b{color:var(--gold-deep);}

  .search-wrap{
    max-width:640px;
    margin:20px auto 0;
    padding:0 16px;
  }
  .search-box{
    display:flex;
    align-items:center;
    background:#FFFDF6;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    box-shadow:0 1px 0 rgba(0,0,0,0.03);
  }
  .search-box svg{flex:0 0 auto; opacity:.55;}
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:16px;
    color:var(--ink);
    padding:0 10px;
    direction:rtl;
  }
  .search-box input::placeholder{color:#9C9270;}

  .results-meta{
    max-width:640px;
    margin:12px auto 0;
    padding:0 20px;
    font-size:13px;
    color:var(--ink-soft);
  }

  .results{
    max-width:640px;
    margin:10px auto 0;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .empty-state{
    max-width:640px;
    margin:60px auto;
    padding:0 30px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:34px; margin-bottom:10px; opacity:.5;}
  .empty-state p{margin:4px 0; font-size:14px; line-height:1.9;}

  .card{
    background:#FFFDF6;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    position:relative;
    transition:box-shadow .15s ease;
  }
  .card:active{box-shadow:inset 0 0 0 1.5px var(--gold);}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card-name{
    font-size:17px;
    font-weight:600;
    color:var(--ink);
    line-height:1.5;
  }
  .card-badges{
    display:flex;
    gap:6px;
    flex:0 0 auto;
  }
  .badge{
    font-size:12px;
    font-weight:600;
    border-radius:6px;
    padding:3px 8px;
    white-space:nowrap;
    border:1px solid transparent;
  }
  .badge.qaid{color:var(--maroon); border-color:rgba(124,59,52,.3); background:rgba(124,59,52,.06);}
  .badge.page{color:var(--gold-deep); border-color:rgba(169,128,61,.3); background:rgba(169,128,61,.08);}

  .card-details{
    margin-top:8px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 14px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .card-details .item span.label{color:#9C9270; margin-left:4px;}
  .card-details .item.full{grid-column:1 / -1;}

  .card-actions{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    display:none;
    gap:8px;
  }
  .card.open .card-actions{display:flex;}
  .card.open{box-shadow:inset 0 0 0 1.5px var(--gold);}

  .btn-mini{
    flex:1;
    text-align:center;
    padding:8px 10px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .btn-mini.edit{color:var(--gold-deep); border-color:rgba(169,128,61,.4);}
  .btn-mini.del{color:var(--red); border-color:rgba(168,58,50,.35);}

  .fab{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--parchment);
    border:none;
    border-radius:999px;
    padding:14px 26px;
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:15px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 6px 18px rgba(29,42,58,0.35);
    cursor:pointer;
    z-index:40;
  }
  .fab:active{transform:translateX(-50%) scale(.97);}

  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(29,42,58,0.45);
    display:none;
    z-index:50;
    align-items:flex-end;
    justify-content:center;
  }
  .sheet-overlay.show{display:flex;}
  .sheet{
    background:var(--parchment);
    width:100%;
    max-width:640px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:18px 20px 24px;
    border-top:3px solid var(--gold);
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0;} to{transform:translateY(0);opacity:1;}}
  .sheet-handle{
    width:40px;height:4px;background:var(--line);
    border-radius:2px; margin:0 auto 14px;
  }
  .sheet h2{
    font-family:'Markazi Text', serif;
    font-size:24px;
    margin:0 0 16px;
    color:var(--ink);
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:15px;
    background:#FFFDF6;
    color:var(--ink);
    direction:rtl;
  }
  .field input:focus{outline:none; border-color:var(--gold);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .sheet-actions{
    display:flex; gap:10px; margin-top:18px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:9px;
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:15px;
    font-weight:600;
    border:none;
    cursor:pointer;
  }
  .btn.primary{background:var(--ink); color:var(--parchment);}
  .btn.secondary{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}

  .toast{
    position:fixed;
    bottom:96px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:var(--parchment);
    padding:10px 18px;
    border-radius:8px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:60;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .loading{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>سجل القيود المدرسي</h1>
  <div class="sub">
    <span>إجمالي القيود: <b id="totalCount">—</b></span>
    <span style="cursor:pointer; text-decoration:underline;" onclick="window.refreshFromServer && window.refreshFromServer()">🔄 تحديث من القاعدة</span>
  </div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D2A3A" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="searchInput" placeholder="ابحث باسم الطالب…" autocomplete="off">
  </div>
</div>

<div class="results-meta" id="resultsMeta"></div>
<div class="results" id="results"></div>

<button class="fab" id="addBtn">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  إضافة قيد جديد
</button>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheetTitle">إضافة قيد جديد</h2>
    <div class="field">
      <label>اسم الطالب *</label>
      <input type="text" id="f_name" placeholder="الاسم الرباعي">
    </div>
    <div class="field">
      <label>اسم الأم</label>
      <input type="text" id="f_mother" placeholder="اسم الأم">
    </div>
    <div class="field-row">
      <div class="field">
        <label>سنة التولد</label>
        <input type="text" id="f_birth" placeholder="مثال: 2010" inputmode="numeric">
      </div>
      <div class="field">
        <label>الشعبة</label>
        <input type="text" id="f_section" list="sectionList" placeholder="مثال: السادس العلمي ( أ )">
        <datalist id="sectionList"></datalist>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>رقم القيد</label>
        <input type="text" id="f_qaid" placeholder="رقم القيد" inputmode="numeric">
      </div>
      <div class="field">
        <label>رقم الصفحة</label>
        <input type="text" id="f_page" placeholder="رقم الصفحة" inputmode="numeric">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn secondary" id="cancelBtn">إلغاء</button>
      <button class="btn primary" id="saveBtn">حفظ القيد</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

let students = null;
let editingId = null;

function normalizeAr(s){
  return (s||'').toString()
    .replace(/[\u064B-\u0652]/g,'')
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/ؤ/g,'و')
    .replace(/ئ/g,'ي')
    .trim();
}

function loadFromCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function saveToCache(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(students)); }catch(e){}
}

async function seedFirestoreIfNeeded(){
  const metaRef = doc(db, 'meta', 'status');
  const metaSnap = await getDoc(metaRef);
  if(metaSnap.exists() && metaSnap.data().seeded) return false;

  const BATCH_SIZE = 450;
  for(let i=0;i<SEED_DATA.length;i+=BATCH_SIZE){
    const batch = writeBatch(db);
    const slice = SEED_DATA.slice(i, i+BATCH_SIZE);
    slice.forEach(rec => {
      const { id, ...data } = rec;
      batch.set(doc(db, STUDENTS_COL, String(id)), data);
    });
    await batch.commit();
    document.getElementById('results').innerHTML =
      `<div class="loading">جارِ استيراد البيانات الأولية… (${Math.min(i+BATCH_SIZE, SEED_DATA.length)} / ${SEED_DATA.length})<br>هذا يحدث مرة واحدة فقط</div>`;
  }
  await setDoc(metaRef, { seeded: true });
  return true;
}

async function fetchAllFromFirestore(){
  const snap = await getDocs(collection(db, STUDENTS_COL));
  const arr = [];
  snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
  return arr;
}

async function loadStudents(){
  const cached = loadFromCache();
  if(cached && cached.length){
    students = cached;
    document.getElementById('totalCount').textContent = students.length.toLocaleString('ar');
    populateSectionList();
    renderEmpty();
    return;
  }

  document.getElementById('results').innerHTML = '<div class="loading">جارِ الاتصال بقاعدة البيانات…</div>';
  try{
    const justSeeded = await seedFirestoreIfNeeded();
    students = justSeeded
      ? SEED_DATA.map(({ id, ...rest }) => ({ id: String(id), ...rest }))
      : await fetchAllFromFirestore();
    saveToCache();
  }catch(e){
    students = SEED_DATA.map(({ id, ...rest }) => ({ id: String(id), ...rest }));
    showToast('تعذر الاتصال بقاعدة البيانات، يعمل الموقع بنسخة محلية مؤقتة');
  }
  document.getElementById('totalCount').textContent = students.length.toLocaleString('ar');
  populateSectionList();
  renderEmpty();
}

async function refreshFromServer(){
  showToast('جارِ التحديث من القاعدة…');
  try{
    students = await fetchAllFromFirestore();
    saveToCache();
    populateSectionList();
    showToast('تم التحديث');
    renderResults(document.getElementById('searchInput').value);
  }catch(e){
    showToast('تعذر التحديث، تحقق من الاتصال');
  }
}
window.refreshFromServer = refreshFromServer;

function populateSectionList(){
  const set = new Set();
  students.forEach(s => { if(s.section) set.add(s.section); });
  const dl = document.getElementById('sectionList');
  dl.innerHTML = Array.from(set).sort().map(s => `<option value="${escapeHtml(s)}">`).join('');
}

function escapeHtml(str){
  return (str||'').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderEmpty(){
  document.getElementById('resultsMeta').textContent = '';
  document.getElementById('results').innerHTML = '';
  const empty = document.createElement('div');
  empty.className = 'empty-state';
  empty.id = 'emptyState';
  empty.innerHTML = `
    <div class="glyph">📖</div>
    <p>اكتب اسم الطالب في خانة البحث لعرض قيده وصفحته.</p>
    <p>يمكنك أيضاً إضافة قيد جديد من الزر أدناه.</p>
  `;
  document.getElementById('results').appendChild(empty);
}

function renderResults(query){
  const meta = document.getElementById('resultsMeta');
  const box = document.getElementById('results');

  if(!query || query.trim().length < 3){
    if(query && query.trim().length > 0){
      document.getElementById('resultsMeta').textContent = '';
      document.getElementById('results').innerHTML = `
        <div class="empty-state">
          <div class="glyph">…</div>
          <p>أدخل 3 أحرف على الأقل من اسم الطالب لعرض النتائج.</p>
        </div>`;
    } else {
      renderEmpty();
    }
    return;
  }

  const nq = normalizeAr(query);
  const matches = students.filter(s => normalizeAr(s.name).includes(nq));

  if(matches.length === 0){
    meta.textContent = 'لا توجد نتائج';
    box.innerHTML = `
      <div class="empty-state">
        <div class="glyph">✕</div>
        <p>لم يُعثر على أي طالب بهذا الاسم.</p>
        <p>تحقق من الإملاء أو أضف قيداً جديداً بهذا الاسم.</p>
      </div>`;
    return;
  }

  meta.textContent = matches.length > 50
    ? (matches.length + ' نتيجة — تُعرض أول 50، دقّق البحث أكثر لتضييق النتائج')
    : (matches.length + ' نتيجة');
  box.innerHTML = matches.slice(0, 50).map(s => cardHtml(s)).join('');

  box.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if(e.target.closest('.btn-mini')) return;
      card.classList.toggle('open');
    });
  });
  box.querySelectorAll('.btn-mini.edit').forEach(btn => {
    btn.addEventListener('click', () => openSheet(btn.dataset.id));
  });
  box.querySelectorAll('.btn-mini.del').forEach(btn => {
    btn.addEventListener('click', () => deleteStudent(btn.dataset.id));
  });
}

function cardHtml(s){
  return `
    <div class="card" data-id="${s.id}">
      <div class="card-top">
        <div class="card-name">${escapeHtml(s.name)}</div>
        <div class="card-badges">
          ${s.qaid ? `<span class="badge qaid">قيد ${escapeHtml(s.qaid)}</span>` : ''}
          ${s.page ? `<span class="badge page">ص ${escapeHtml(s.page)}</span>` : ''}
        </div>
      </div>
      <div class="card-details">
        <div class="item"><span class="label">اسم الأم:</span>${escapeHtml(s.mother) || '—'}</div>
        <div class="item"><span class="label">سنة التولد:</span>${escapeHtml(s.birth) || '—'}</div>
        ${s.section ? `<div class="item full"><span class="label">الشعبة:</span>${escapeHtml(s.section)}</div>` : ''}
      </div>
      <div class="card-actions">
        <button class="btn-mini edit" data-id="${s.id}">تعديل</button>
        <button class="btn-mini del" data-id="${s.id}">حذف</button>
      </div>
    </div>
  `;
}

function openSheet(id){
  editingId = id || null;
  const sheet = document.getElementById('sheetOverlay');
  const title = document.getElementById('sheetTitle');
  if(id){
    const s = students.find(x => x.id === id);
    title.textContent = 'تعديل القيد';
    document.getElementById('f_name').value = s.name || '';
    document.getElementById('f_mother').value = s.mother || '';
    document.getElementById('f_birth').value = s.birth || '';
    document.getElementById('f_section').value = s.section || '';
    document.getElementById('f_qaid').value = s.qaid || '';
    document.getElementById('f_page').value = s.page || '';
  } else {
    title.textContent = 'إضافة قيد جديد';
    ['f_name','f_mother','f_birth','f_section','f_qaid','f_page'].forEach(id2 => document.getElementById(id2).value = '');
  }
  sheet.classList.add('show');
}

function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('show');
  editingId = null;
}

async function saveStudent(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){
    showToast('الرجاء إدخال اسم الطالب');
    return;
  }
  const data = {
    name,
    mother: document.getElementById('f_mother').value.trim(),
    birth: document.getElementById('f_birth').value.trim(),
    section: document.getElementById('f_section').value.trim(),
    qaid: document.getElementById('f_qaid').value.trim(),
    page: document.getElementById('f_page').value.trim(),
  };

  try{
    if(editingId){
      const idx = students.findIndex(x => x.id === editingId);
      if(idx > -1) students[idx] = { id: editingId, ...data };
      await updateDoc(doc(db, STUDENTS_COL, editingId), data);
      showToast('تم تحديث القيد');
    } else {
      const ref = await addDoc(collection(db, STUDENTS_COL), data);
      students.push({ id: ref.id, ...data });
      document.getElementById('totalCount').textContent = students.length.toLocaleString('ar');
      showToast('تمت إضافة القيد الجديد');
    }
    saveToCache();
  }catch(e){
    showToast('تعذر حفظ التعديل، تحقق من الاتصال وحاول مجدداً');
    return;
  }

  populateSectionList();
  closeSheet();

  const q = document.getElementById('searchInput').value;
  if(q && q.trim().length > 0){
    renderResults(q);
  } else {
    document.getElementById('searchInput').value = name;
    renderResults(name);
  }
}

async function deleteStudent(id){
  if(!confirm('هل تريد حذف هذا القيد نهائياً؟')) return;
  try{
    await deleteDoc(doc(db, STUDENTS_COL, id));
    students = students.filter(x => x.id !== id);
    saveToCache();
    document.getElementById('totalCount').textContent = students.length.toLocaleString('ar');
    showToast('تم حذف القيد');
  }catch(e){
    showToast('تعذر حذف القيد، حاول مجدداً');
  }
  renderResults(document.getElementById('searchInput').value);
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

let debounceTimer;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(debounceTimer);
  const val = e.target.value;
  debounceTimer = setTimeout(() => renderResults(val), 120);
});

document.getElementById('addBtn').addEventListener('click', () => openSheet(null));
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
document.getElementById('saveBtn').addEventListener('click', saveStudent);
document.getElementById('sheetOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'sheetOverlay') closeSheet();
});

document.getElementById('results').innerHTML = '<div class="loading">جارِ تحميل السجل…</div>';
loadStudents();
</script>
</body>
</html>
